aid: openphone
name: OpenPhone
description: >-
  OpenPhone (rebranded to Quo in 2026) is a business phone and customer
  communications platform that provides shared phone numbers, calling, SMS/MMS
  texting, AI call summaries and transcripts, contacts, conversations, and tasks
  for teams. Its public REST API lets developers programmatically send messages,
  list and retrieve calls with recordings and voicemails, manage contacts and
  custom fields, manage conversations and tasks, look up phone numbers and users,
  and subscribe to webhooks for message and call events. The API uses API-key
  authentication in the Authorization header, returns JSON over HTTPS at
  https://api.quo.com, uses cursor-based pagination, and is rate limited to 10
  requests per second. OpenPhone was surfaced as a portfolio company of 500
  Global and profiled into the API Evangelist network.
