  /v1/calls/{callId}:
    get:
      tags:
      - Calls
      summary: Get a call by ID
      description: Get a call by its unique identifier.
      operationId: getCallById_v1
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          description: Unique identifier of the call.
          examples:
          - AC3700e624eca547eb9f749a06f2eb1
          pattern: ^AC(.*)$
          type: string
        example: AC3700e624eca547eb9f749a06f2eb1
      security:
      - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    additionalProperties: false
                    type: object
                    required:
                    - answeredAt
                    - answeredBy
                    - initiatedBy
                    - direction
                    - status
                    - completedAt
                    - createdAt
                    - callRoute
                    - duration
                    - forwardedFrom
                    - forwardedTo
                    - aiHandled
                    - id
                    - phoneNumberId
                    - participants
                    - updatedAt
                    - userId
                    properties:
                      answeredAt:
                        anyOf:
                        - description: The timestamp when the call was answered in ISO 8601 format. Null if the call was not answered.
                          examples:
                          - '2022-01-01T00:00:00Z'
                          format: date-time
                          type: string
                          example: '2022-01-01T00:00:00Z'
                        - type: 'null'
                      answeredBy:
                        anyOf:
                        - description: The unique identifier of the Quo user who answered the incoming call. Null for outgoing calls or unanswered incoming calls.
                          examples:
                          - USlHhXmRMz
                          type: string
                          example: USlHhXmRMz
                        - type: 'null'
                      initiatedBy:
                        anyOf:
                        - description: The unique identifier of the Quo user who initiated the outgoing call. Null for incoming calls.
                          examples:
                          - USlHhXmRMz
                          type: string
                          example: USlHhXmRMz
                        - type: 'null'
                      direction:
                        type: string
                        enum:
                        - incoming
                        - outgoing
                        description: The direction of the call relative to the Quo number.
                        examples:
                        - incoming
                        example: incoming
                      status:
                        type: string
                        enum:
                        - queued
                        - initiated
                        - ringing
                        - in-progress
                        - completed
                        - busy
                        - failed
                        - no-answer
                        - canceled
                        - missed
                        - answered
                        - forwarded
                        - abandoned
                        description: The current status of the call.
                        examples:
                        - completed
                        example: completed
                      completedAt:
                        anyOf:
                        - description: The timestamp when the call ended, in ISO 8601 format. Null if the call is ongoing or was not completed.
                          examples:
                          - '2022-01-01T00:00:00Z'
                          format: date-time
                          type: string
                          example: '2022-01-01T00:00:00Z'
                        - type: 'null'
                      createdAt:
                        description: The timestamp when the call record was created, in ISO 8601 format.
                        examples:
                        - '2022-01-01T00:00:00Z'
                        format: date-time
                        type: string
                        example: '2022-01-01T00:00:00Z'
                      callRoute:
                        anyOf:
                        - description: 'How the call reached the user''s inbox: either by direct dial to their number or routed through a phone menu. Null for outbound calls.'
                          examples:
                          - phone-number
                          - phone-menu
                          type: string
                          example: phone-number
                        - type: 'null'
                      duration:
                        description: The total duration of the call in seconds.
                        examples:
                        - 60
                        type: integer
                        example: 60
                      forwardedFrom:
                        anyOf:
                        - description: The phone number or Quo user ID from which the call was forwarded. Null if the call was not forwarded.
                          examples:
                          - US123abc
                          example: US123abc
                          anyOf:
                          - description: A phone number in E.164 format, including the country code.
