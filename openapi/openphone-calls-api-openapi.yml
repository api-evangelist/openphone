openapi: 3.1.0
info:
  title: Quo Public Calls API
  version: 1.0.0
  description: API for connecting with Quo.
  contact:
    name: Quo Support
    email: support@quo.com
    url: https://support.quo.com/
  termsOfService: https://www.quo.com/terms
servers:
- description: Production server
  url: https://api.quo.com
security:
- apiKey: []
tags:
- description: Operations related to calls
  name: Calls
paths:
  /v1/call-recordings/{callId}:
    get:
      tags:
      - Calls
      summary: Get recordings for a call
      description: Retrieve a list of recordings associated with a specific call. The results are sorted chronologically, with the oldest recording segment appearing first in the list.
      operationId: getCallRecordings_v1
      parameters:
      - in: path
        name: callId
        required: true
        schema:
          description: The unique identifier of the call for which recordings are being retrieved.
          examples:
          - AC3700e624eca547eb9f749a06f
          pattern: ^AC(.*)$
          type: string
        example: AC3700e624eca547eb9f749a06f
      security:
      - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      additionalProperties: false
                      type: object
                      required:
                      - duration
                      - id
                      - startTime
                      - status
                      - type
                      - url
                      properties:
                        duration:
                          anyOf:
                          - description: The length of the call recording in seconds. Null if the recording is not completed or the duration is unknown.
                            examples:
                            - 60
                            type: integer
                            example: 60
                          - type: 'null'
                        id:
                          description: The unique identifier of the call recording.
                          examples:
                          - CRwRVK2qBq
                          type: string
                          example: CRwRVK2qBq
                        startTime:
                          anyOf:
                          - description: The timestamp when the recording began, in ISO 8601 format. Null if the recording hasn't started or the start time is unknown.
                            examples:
                            - '2022-01-01T00:00:00Z'
                            format: date-time
                            type: string
                            example: '2022-01-01T00:00:00Z'
                          - type: 'null'
                        status:
                          anyOf:
                          - type: string
                            enum:
                            - absent
                            - completed
                            - deleted
                            - failed
                            - in-progress
                            - paused
                            - processing
                            - stopped
                            - stopping
                            description: The current status of the call recording.
                            examples:
                            - completed
                            example: completed
                          - type: 'null'
                        type:
                          anyOf:
                          - description: The file type of the call recording. Null if the type is not specified or is unknown.
                            examples:
                            - audio/mpeg
                            type: string
                            example: audio/mpeg
                          - type: 'null'
                        url:
                          anyOf:
                          - description: The URL where the call recording can be accessed or downloaded. Null if the URL is not available or the recording is not accessible.
                            examples:
                            - https://examplestorage.com/a643d4d3e1484fcc8b721627284eda5e.mp3
                            format: uri-reference
                            type: string
                            example: https://examplestorage.com/a643d4d3e1484fcc8b721627284eda5e.mp3
                          - type: 'null'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - status
                - docs
                - title
                properties:
                  message:
                    type: string
                  code:
                    const: 0900400
                    type: string
                  status:
                    const: 400
                    type: number
                  docs:
                    const: https://quo.com/docs
                    type: string
                  title:
                    const: Bad Request
                    type: string
                  trace:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - message
                      - schema
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        value: {}
                        schema:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - status
                - docs
                - title
                properties:
                  message:
                    type: string
                  code:
                    const: 0900401
                    type: string
                  status:
                    const: 401
                    type: number
                  docs:
                    const: https://quo.com/docs
                    type: string
                  title:
                    const: Unauthorized
                    type: string
                  trace:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - message
                      - schema
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        value: {}
                        schema:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - code
                - status
                - docs
                - title
                properties:
                  message:
                    type: string
                  code:
                    const: 0900403
                    type: string
                  status:
                    const: 403
                    type: number
                  docs:
                    const: https://quo.com/docs
                    type: string
                  title:
                    const: Forbidden
                    type: string
                  trace:
                    type: string
                  errors:
                    type: array
                    items:
