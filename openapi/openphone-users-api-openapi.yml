                          examples:
                          - johndoe@example.com
                          format: email
                          type: string
                          example: johndoe@example.com
                        firstName:
                          anyOf:
                          - description: The user's first name.
                            examples:
                            - John
                            type: string
                            example: John
                          - type: 'null'
                        lastName:
                          anyOf:
                          - description: The user's last name.
                            examples:
                            - Doe
                            type: string
                            example: Doe
                          - type: 'null'
                        pictureUrl:
                          anyOf:
                          - description: The user's picture URL.
                            examples:
                            - https://example.com/picture.jpg
                            format: uri
                            type: string
                            example: https://example.com/picture.jpg
                          - type: 'null'
                        role:
                          type: string
                          enum:
                          - owner
                          - admin
                          - member
                          description: The user's role in the organization.
                          examples:
                          - owner
                          - admin
