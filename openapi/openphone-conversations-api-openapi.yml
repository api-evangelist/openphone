openapi: 3.2.0
info:
  title: Openphone Conversations API
  version: 1.0.0
  contact:
    name: Quo Support
    email: support@quo.com
    url: https://support.quo.com/
  termsOfService: https://www.quo.com/terms
  description: 'Operations tagged Conversations across 2 of this provider''s published API definitions: openphone-2026-03-30-openapi.json, openphone-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Production server
  url: https://api.quo.com
security:
- apiKey: []
tags:
- description: Operations related to conversations
  name: Conversations
paths:
  /conversations/{conversationId}/mark-as-read:
    post:
      tags:
      - Conversations
      summary: Mark conversation as read
      description: Mark a conversation as read, clearing its unread indicator without sending a message. Returns the updated conversation.
      operationId: markConversationAsRead
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          description: The unique identifier of the conversation to mark as read.
          examples:
          - CN123abc
          pattern: ^CN(.*)$
          type: string
        example: CN123abc
      - in: header
        name: Quo-Api-Version
        required: true
        schema:
          type: string
          enum:
          - '2026-03-30'
          description: 'API version header. Supported values: 2026-03-30'
      security:
      - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - assignedTo
                    - createdAt
                    - deletedAt
                    - id
                    - lastActivityAt
                    - lastActivityId
                    - mutedUntil
                    - name
                    - participants
                    - phoneNumberId
                    - snoozedUntil
                    - updatedAt
                    properties:
                      assignedTo:
                        anyOf:
                        - description: The unique identifier of the user or system user the conversation is assigned to.
                          examples:
                          - US123abc
                          - SYU123abc
                          example: US123abc
                          anyOf:
                          - pattern: ^US(.*)$
                            type: string
                          - pattern: ^SYU(.*)$
                            type: string
                        - type: 'null'
                      createdAt:
                        anyOf:
                        - format: date-time
                          type: string
                        - type: 'null'
                      deletedAt:
                        anyOf:
                        - format: date-time
                          type: string
                        - type: 'null'
                      id:
                        description: The unique identifier of the conversation.
                        examples:
                        - CN123abc
                        pattern: ^CN(.*)$
                        type: string
                        example: CN123abc
                      lastActivityAt:
                        anyOf:
                        - format: date-time
                          type: string
                        - type: 'null'
                      lastActivityId:
                        anyOf:
                        - description: The unique identifier of the most recent activity in the conversation.
                          examples:
                          - AC123abc
                          pattern: ^AC(.*)$
                          type: string
                          example: AC123abc
                        - type: 'null'
                      mutedUntil:
                        anyOf:
                        - format: date-time
                          type: string
                        - type: 'null'
                      name:
                        anyOf:
                        - description: The custom name of the conversation. Will be null if no custom name is set.
                          examples:
                          - Chat with customer
                          type: string
                          example: Chat with customer
                        - type: 'null'
                      participants:
                        type: array
                        items:
                          description: A phone number in E.164 format, including the country code.
                          examples:
                          - '+15555555555'
                          pattern: ^\+[1-9]\d{1,14}$
                          type: string
                          example: '+15555555555'
                      phoneNumberId:
                        description: The unique identifier of the Quo phone number associated with the conversation.
                        examples:
                        - PN123abc
                        pattern: ^PN(.*)$
                        type: string
                        example: PN123abc
                      snoozedUntil:
                        anyOf:
                        - format: date-time
                          type: string
                        - type: 'null'
                      updatedAt:
                        anyOf:
                        - format: date-time
                          type: string
                        - type: 'null'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - docs
                - title
                properties:
                  message:
                    type: string
                  docs:
                    const: https://quo.com/docs
                    type: string
                  title:
                    const: Bad Request
                    type: string
                  trace:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - message
                      - schema
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        value: {}
                        schema:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
              example:
                message: The input was invalid
                docs: https://quo.com/docs
                title: Bad Request
                errors:
                - path: /conversationId
                  message: Expected string to match '^CN(.*)$'
                  value: abc123
                  schema:
                    type: TemplateLiteral
                    pattern: ^CN(.*)$
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - docs
                - title
                properties:
                  message:
                    type: string
                  docs:
                    const: https://quo.com/docs
                    type: string
                  title:
                    const: Unauthorized
                    type: string
                  trace:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - message
                      - schema
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        value: {}
                        schema:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
              example:
                message: Unauthorized
                docs: https://quo.com/docs
                title: Unauthorized
                trace: '6897907457496870895'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - docs
                - title
                properties:
                  message:
                    type: string
                  docs:
                    const: https://quo.com/docs
                    type: string
                  title:
                    const: Forbidden
                    type: string
                  trace:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - message
                      - schema
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        value: {}
                        schema:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
              example:
                message: User is forbidden to perform this action
                docs: https://quo.com/docs
                title: Forbidden
                trace: '6897907457496870895'
