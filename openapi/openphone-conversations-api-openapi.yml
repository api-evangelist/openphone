                          - type: 'null'
                        mutedUntil:
                          anyOf:
                          - format: date-time
                            type: string
                          - type: 'null'
                        name:
                          anyOf:
                          - description: The custom name of the conversation. Will be null if no custom name is set.
                            examples:
