                    type: string
                    example: Discuss pricing and onboarding next steps.
                  dueDate:
                    format: date-time
                    type: string
                  assignedTo:
                    pattern: ^US(.*)$
                    type: string
                  activityId:
                    pattern: ^AC(.*)$
                    type: string
