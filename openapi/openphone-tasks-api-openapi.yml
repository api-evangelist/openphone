                          - anyOf:
                            - pattern: ^US(.*)$
                              type: string
                            - pattern: ^SYU(.*)$
                              type: string
                          - type: 'null'
                        createdAt:
                          format: date-time
                          type: string
                        createdBy:
                          type: string
                        completed:
                          type: boolean
                        isDeleted:
                          type: boolean
                        revision:
                          type: string
                  nextPageToken:
                    type: string
                  totalItems:
                    description: Total number of items available.
                    type: integer
