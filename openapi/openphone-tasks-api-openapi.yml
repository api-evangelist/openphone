openapi: 3.1.0
info:
  title: Quo Public Calls Tasks API
  version: 1.0.0
  description: API for connecting with Quo.
  contact:
    name: Quo Support
    email: support@quo.com
    url: https://support.quo.com/
  termsOfService: https://www.quo.com/terms
servers:
- description: Production server
  url: https://api.quo.com
security:
- apiKey: []
tags:
- name: Tasks
paths:
  /v1/tasks:
    get:
      tags:
      - Tasks
      summary: List tasks
      description: Retrieve a list of tasks
      operationId: listTasks_v1
      parameters:
      - in: query
        name: maxResults
        required: true
        schema:
          description: Maximum number of results to return per page.
          default: 50
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: pageToken
        required: false
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - totalItems
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - taskId
                      - phoneNumberId
                      - conversationId
                      - activityId
                      - phoneNumberGroupId
                      - orgId
                      - title
                      - description
                      - dueDate
                      - assignedTo
                      - assignedBy
                      - createdAt
                      - createdBy
                      - completed
                      - isDeleted
                      - revision
                      properties:
                        taskId:
                          pattern: ^TK(.*)$
                          type: string
                        phoneNumberId:
                          anyOf:
                          - pattern: ^PN(.*)$
                            type: string
                          - type: 'null'
                        conversationId:
                          anyOf:
                          - pattern: ^CN(.*)$
                            type: string
                          - type: 'null'
                        activityId:
