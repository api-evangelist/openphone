                          - type: 'null'
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                        dueDate:
                          anyOf:
                          - format: date-time
                            type: string
                          - type: 'null'
                        assignedTo:
                          anyOf:
                          - anyOf:
                            - pattern: ^US(.*)$
                              type: string
                            - pattern: ^SYU(.*)$
                              type: string
                          - type: 'null'
                        assignedBy:
