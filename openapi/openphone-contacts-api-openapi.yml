openapi: 3.2.0
info:
  title: Openphone Contacts API
  version: 1.0.0
  contact:
    name: Quo Support
    email: support@quo.com
    url: https://support.quo.com/
  termsOfService: https://www.quo.com/terms
  description: 'Operations tagged Contacts across 2 of this provider''s published API definitions: openphone-2026-03-30-openapi.json, openphone-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Production server
  url: https://api.quo.com
security:
- apiKey: []
tags:
- description: Operations related to contacts
  name: Contacts
paths:
  /contacts:
    get:
      tags:
      - Contacts
      summary: List contacts
      description: Get a paginated list of contacts.
      operationId: listContacts
      parameters:
      - in: query
        name: externalIds
        required: false
        schema:
          anyOf:
          - description: Filter by external IDs
            maxItems: 50
            type: array
            items:
              type: string
          - type: 'null'
      - in: query
        name: sources
        required: false
        schema:
          anyOf:
          - description: Filter by source labels
            maxItems: 50
            type: array
            items:
              type: string
          - type: 'null'
      - in: query
        name: limit
        required: false
        schema:
          anyOf:
          - minimum: 1
            maximum: 50
            default: 10
            description: Page size
            type: integer
          - type: 'null'
      - in: query
        name: after
        required: false
        schema:
          anyOf:
          - examples:
            - eyJsYXN0SWQiOiJVU211a09NaXBhIn0
            type: string
          - type: 'null'
      - in: header
        name: Quo-Api-Version
        required: true
        schema:
          type: string
          enum:
          - '2026-03-30'
          description: 'API version header. Supported values: 2026-03-30'
      security:
      - apiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - nextCursor
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - createdAt
                      - updatedAt
                      - actorId
                      properties:
                        id:
                          description: The ID of the contact.
                          examples:
                          - 6a145ff26212a192852c856e
                          pattern: ^(.*)$
                          type: string
                          example: 6a145ff26212a192852c856e
                        externalId:
                          anyOf:
                          - description: The external ID of the contact.
                            examples:
                            - '1234567890'
                            type: string
                            example: '1234567890'
                          - type: 'null'
                        source:
                          anyOf:
                          - description: The source of the contact.
                            examples:
                            - public-api
                            type: string
                            example: public-api
                          - type: 'null'
                        sourceUrl:
                          anyOf:
                          - description: A link to the contact in the source system.
                            format: uri
                            examples:
                            - https://example.com/contacts/001
                            minLength: 1
                            maxLength: 200
                            type: string
                            example: https://example.com/contacts/001
                          - type: 'null'
                        firstName:
                          anyOf:
                          - description: The first name of the contact.
                            examples:
                            - John
                            type: string
                            example: John
                          - type: 'null'
                        lastName:
                          anyOf:
                          - description: The last name of the contact.
                            examples:
                            - Doe
                            type: string
                            example: Doe
                          - type: 'null'
                        company:
                          anyOf:
                          - description: The company of the contact.
                            examples:
                            - Quo
                            type: string
                            example: Quo
                          - type: 'null'
                        role:
                          anyOf:
                          - description: The role of the contact.
                            examples:
                            - admin
                            type: string
                            example: admin
                          - type: 'null'
                        createdAt:
                          description: The timestamp of the contact creation.
                          examples:
                          - '2021-01-01T00:00:00Z'
                          format: date-time
                          type: string
                          example: '2021-01-01T00:00:00Z'
                        updatedAt:
                          description: The timestamp of the contact update.
                          examples:
                          - '2021-01-01T00:00:00Z'
                          format: date-time
                          type: string
                          example: '2021-01-01T00:00:00Z'
                        actorId:
                          description: The actor ID of the contact.
                          examples:
                          - US123abc
                          example: US123abc
                          anyOf:
                          - pattern: ^US(.*)$
                            type: string
                          - pattern: ^SYU(.*)$
                            type: string
                  nextCursor:
                    description: Cursor for the next page, or null when there are no more pages.
                    examples:
                    - eyJsYXN0SWQiOiJVU211a09NaXBhIn0
                    example: eyJsYXN0SWQiOiJVU211a09NaXBhIn0
                    anyOf:
                    - type: string
                    - type: 'null'
